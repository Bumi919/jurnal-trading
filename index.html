<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="description" content="Jurnal Trading - catatan dan evaluasi transaksi, sinkron antar perangkat.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-180.png">
<title>Jurnal Trading</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-title">JURNAL TRADING</div>
      <div class="brand-sub">Catatan dan Evaluasi Transaksi</div>
    </div>

    <nav class="nav" id="nav">
      <a href="#/dashboard" data-route="dashboard">Dashboard</a>
      <a href="#/trades" data-route="trades">Log Transaksi</a>
      <a href="#/calendar" data-route="calendar">Kalender</a>
      <a href="#/analytics" data-route="analytics">Analitik</a>
      <a href="#/playbook" data-route="playbook">Playbook</a>
      <a href="#/risk" data-route="risk">Risk &amp; Plan</a>
      <a href="#/settings" data-route="settings">Pengaturan</a>
    </nav>

    <div class="sidebar-foot" id="sidebarSummary"></div>
    <div class="sidebar-foot" id="accountBox" style="border-top:1px solid var(--line)"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn btn-ghost btn-sm" id="menuBtn" type="button">Menu</button>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="topbar-actions">
        <select id="langSel" class="lang-sel" title="Bahasa / Language"></select>
        <button class="btn btn-primary" id="quickAdd" type="button">Tambah Trade</button>
      </div>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/stats.js"></script>
<script src="js/charts.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/cloud.js"></script>
<script src="js/app.js"></script>
</body>
</html>
